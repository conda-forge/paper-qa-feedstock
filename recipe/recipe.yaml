schema_version: 1

context:
  name: paper-qa
  version: "2026.8.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/paper_qa-${{ version }}.tar.gz
  sha256: 1120a4d233bb319477d07a62b5384d73beaa95c1cda31ed022804d27a16c23c4

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=64
    - setuptools-scm >=8
    - pip
  run:
    - httpx-aiohttp
    - paper-qa-pypdf
    - fhlmi >=0.45.0
    - aiohttp >=3.10.6
    - anyio
    - fhaviary >=0.34
    - httpx
    - pybtex
    - pydantic-settings
    - pymupdf >=1.24.12
    - rich
    - setuptools
    - tantivy
    - tenacity
    - python >=${{ python_min }}
    - html2text
    - numpy
    - pydantic >=2.0,<3.dev0,>=2.10.1
    - tiktoken >=0.4.0

tests:
  - python:
      imports:
        - paperqa
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: LLM Chain for answering questions from docs
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/whitead/paper-qa

extra:
  recipe-maintainers:
    - jan-janssen
